[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "copydock"
version = "0.0.1"
description = "Package a Docker Compose app into a portable bundle you can install on any Linux server, online or offline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
copydock = "copydock.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/copydock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Typer's idiom is typer.Option(...) in argument defaults.
extend-ignore = ["B008"]

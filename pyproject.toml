[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "copydock"
version = "0.1.0"
description = "Package a Docker Compose app into a portable bundle you can install on any Linux server, online or offline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dominic Quainoo Amuah" }]
keywords = ["docker", "docker-compose", "deployment", "offline", "air-gapped", "bundle", "installer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Dominic62q/copydock"
Source = "https://github.com/Dominic62q/copydock"
Issues = "https://github.com/Dominic62q/copydock/issues"

[project.scripts]
copydock = "copydock.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/copydock"]

# Keep the source download small: code, README and license only.
[tool.hatch.build.targets.sdist]
include = ["src/copydock", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Typer's idiom is typer.Option(...) in argument defaults.
extend-ignore = ["B008"]

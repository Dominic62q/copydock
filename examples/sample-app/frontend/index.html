<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CopyDock sample app</title>
</head>
<body>
  <h1>CopyDock sample app</h1>
  <p>API status: <span id="status">checking...</span></p>
  <script>
    fetch("/api/health")
      .then(r => r.json())
      .then(d => { document.getElementById("status").textContent = d.status; })
      .catch(() => { document.getElementById("status").textContent = "unreachable"; });
  </script>
</body>
</html>
